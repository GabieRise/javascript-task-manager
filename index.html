
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Task Manager</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <h1>TaskFlow</h1>
            <p>Organise your day, one task at a time.</p>
        </header>

        <!-- Task Form -->
        
<!-- TASK FORM -->

<section class="task-form-section">

    <form id="task-form">

        <label for="task-input">
            What do you need to do?
        </label>

        <div class="input-group">

            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                required
            >

            <!-- Priority Selection -->

            <select id="task-priority" name="priority">
                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>
            </select>

            <button type="submit">
                Add Task
            </button>

        </div>

    </form>

</section>


        <!-- Task Filters -->
        <section class="task-section">


<!-- TASK SUMMARY DASHBOARD -->

<div class="task-summary">

    <article class="summary-card">
        <span>Total Tasks</span>
        <h3 id="total-count">0</h3>
    </article>

    <article class="summary-card">
        <span>Active Tasks</span>
        <h3 id="active-count">0</h3>
    </article>

    <article class="summary-card">
        <span>Completed Tasks</span>
        <h3 id="completed-count">0</h3>
    </article>

    <article class="summary-card">
        <span>High Priority</span>
        <h3 id="high-priority-count">0</h3>
    </article>

</div>


<!-- TASK COMPLETION PROGRESS -->

<div class="progress-section">

    <div class="progress-heading">

        <h3>Daily Progress</h3>

        <span id="progress-percentage">0%</span>

    </div>

    <div
        class="progress-track"
        id="progress-track"
        role="progressbar"
        aria-label="Tasks completed"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
    >

        <div
            class="progress-fill"
            id="progress-fill"
        ></div>

    </div>

    <p id="progress-summary">
        0 of 0 tasks completed
    </p>

</div>



            <div class="task-heading">
                <h2>My Tasks</h2>
                <p id="task-count">0 tasks</p>
            </div>

            <div class="task-filters">

                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="active">
                    Active
                </button>

                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>

            </div>

            <!-- Task List -->
            <ul id="task-list">

            </ul>

            <p id="empty-message">
                No tasks yet. Add your first task!
            </p>

        </section>


<div class="task-toolbar">

    <button
        type="button"
        id="clear-completed"
        class="clear-completed-btn"
    >
        Clear Completed
    </button>

</div>
<!-- Footer, ending of web -->

        <footer class="app-footer">
            <p>Built with HTML, CSS and JavaScript.</p>
        </footer>

    </main>

</body>
</html>
